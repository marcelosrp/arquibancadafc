services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: arquibancada
      POSTGRES_PASSWORD: arquibancada
      POSTGRES_DB: arquibancada
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arquibancada -d arquibancada"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
